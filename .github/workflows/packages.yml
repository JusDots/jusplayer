name: Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'windows/**'
      - 'linux/**'
      - 'tui/**'
      - 'scripts/package-desktop.sh'
      - '.github/workflows/packages.yml'

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  linux:
    name: Linux desktop (.deb / .rpm / app image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # jpackage needs dpkg-deb + fakeroot for .deb and rpmbuild for .rpm.
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev fakeroot rpm
          which dpkg-deb rpmbuild fakeroot

      - name: Build the packages
        run: ./scripts/package-desktop.sh --deb --rpm --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Collect the artefacts
        run: |
          mkdir -p artefacts
          cp -f dist/*.tar.gz artefacts/ 2>/dev/null || true
          find linux/build/compose/binaries/main -maxdepth 2 \
            \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} artefacts/ \; 2>/dev/null || true
          ls -lh artefacts

      - uses: actions/upload-artifact@v4
        with:
          name: jusplayer-linux-x64
          path: artefacts/
          if-no-files-found: warn

  windows:
    name: Windows desktop (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # jpackage builds .msi through WiX; the image may not have it yet.
      - name: Ensure WiX is available
        shell: pwsh
        run: |
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
          }
          wix --version

      - name: Build the packages
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          .\gradlew.bat :windows:createDistributable :windows:packageMsi :windows:packageExe --stacktrace

      - name: Collect the artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artefacts | Out-Null
          Copy-Item -Path windows\build\compose\binaries\main\*.msi -Destination artefacts -ErrorAction SilentlyContinue
          Copy-Item -Path windows\build\compose\binaries\main\*.exe -Destination artefacts -ErrorAction SilentlyContinue
          Get-ChildItem artefacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: jusplayer-windows-x64
          path: artefacts/
          if-no-files-found: warn

  tui:
    name: Terminal client (tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke test the client
        run: |
          cd tui
          node --check src/main.mjs
          node --check src/app.mjs
          node --check src/ui.mjs
          node --check src/api.mjs
          node --check src/player.mjs
          node --check src/discord.mjs

      - name: Package the client
        run: |
          mkdir -p artefacts
          tar -czf artefacts/jusplayer-tui.tar.gz -C tui src package.json README.md

      - uses: actions/upload-artifact@v4
        with:
          name: jusplayer-tui
          path: artefacts/
          if-no-files-found: warn
